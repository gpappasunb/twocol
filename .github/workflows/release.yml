name: Release

# Pushing a tag such as v1.3.0 publishes a GitHub release with the extension
# zip. The tag must match the version in _extensions/twocol/_extension.yaml.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the extension version
        run: |
          version=$(sed -n 's/^version: *//p' _extensions/twocol/_extension.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in _extensions/twocol/_extension.yaml"
            exit 1
          fi

      - name: Check that both copies of the filter are the same
        run: cmp twocol.lua _extensions/twocol/twocol.lua

      - name: Build the zip file
        run: zip -r twocol.zip _extensions

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" twocol.zip
          --title "$GITHUB_REF_NAME" --generate-notes
